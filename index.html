<script>
(function(){
const $=s=>document.querySelector(s);
const KEY='zov_save_v3';
const ROMAN=['I','II','III','IV','V','VI'];
const RN=n=>(typeof ALIAS!=='undefined'&&ALIAS[n])||n;
const IMG=n=>{n=RN(n);return 'img/'+n+(/^(bg_|cg_|tex_)/.test(n)?'.jpg':'.webp');};
const SHE_AV="url('img/she_tender.webp')";

/* ---------- utils ---------- */
const norm=s=>s.toLowerCase().replace(/ё/g,'е').replace(/[^0-9a-zа-я]/g,'');
function fnv(s){let h=0x811c9dc5;const b=new TextEncoder().encode('zov26:'+norm(s));for(const x of b){h^=x;h=Math.imul(h,0x01000193)>>>0;}return h.toString(16).padStart(8,'0');}
const dec=b=>{try{return decodeURIComponent(escape(atob(b)));}catch(e){return '';}};
const TG=(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData!==undefined)?window.Telegram.WebApp:null;
if(TG){try{TG.ready();TG.expand();TG.setHeaderColor&&TG.setHeaderColor('#020606');TG.setBackgroundColor&&TG.setBackgroundColor('#020606');TG.disableVerticalSwipes&&TG.disableVerticalSwipes();TG.enableClosingConfirmation&&TG.enableClosingConfirmation();}catch(e){}}
const cloudOK=()=>TG&&TG.CloudStorage&&TG.isVersionAtLeast&&TG.isVersionAtLeast('6.9');
function cloudSave(v){if(!cloudOK())return;try{let o=Object.assign({},v,{chat:(v.chat||[]).slice(-12)});let t=JSON.stringify(o);if(t.length>4000){o.chat=[];t=JSON.stringify(o);}TG.CloudStorage.setItem(KEY,t,()=>{});}catch(e){}}
function cloudLoad(cb){if(!cloudOK())return cb(null);let done=false;const fin=v=>{if(!done){done=true;cb(v);}};setTimeout(()=>fin(null),2500);try{TG.CloudStorage.getItem(KEY,(err,val)=>{try{fin(val?JSON.parse(val):null);}catch(e){fin(null);}});}catch(e){fin(null);}}
function cloudClear(){if(cloudOK())try{TG.CloudStorage.removeItem(KEY,()=>{});}catch(e){}}
const store={get(){try{return JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){return null;}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}cloudSave(v);},clear(){try{localStorage.removeItem(KEY);}catch(e){}cloudClear();}};

/* ---------- state ---------- */
let S={i:0,inv:[],chat:[],mode:'vn',bg:'',pose:'',chapter:0,started:false,hints:{}};
const save=()=>store.set(S);

/* ---------- preload ---------- */
['bg_bedroom_morning','bg_kitchen','bg_rlyeh_shore','bg_rlyeh_gate','bg_rlyeh_temple','bg_bedroom_dawn','cg_final','bg_folder','bg_rlyeh_rising','item_log','item_envelope','tex_paper','tex_stone','she_neutral','she_mysterious','she_tender','hero_shocked','cat_udon','cat_sima','npc_nightgaunt','npc_deepone','item_note','item_can','item_clipping','item_page','item_seal','item_offering'].forEach(n=>{const i=new Image();i.src=IMG(n);});

/* ---------- visuals ---------- */
function setBg(n){S.bg=n;const b=$('#bg');b.className=S.tint?'tint':'';if(RN(n)==='desk'){b.classList.add('desk');b.style.backgroundImage='';}else if(false){}else if(n){b.style.backgroundImage=`url('${IMG(n)}')`;}}
function setPose(n,ghost){S.pose=n;const c=$('#char');if(!n){c.className='';return;}const src=IMG(n);if(!c.src.endsWith(src))c.src=src;c.className='on'+(n.startsWith('cat_')?' cat':'')+(ghost?' ghost':'');}
function setMode(m){S.mode=m;$('#chat').classList.toggle('on',m==='chat');if(m==='chat'){$('#dlg').classList.remove('on');setPose('');}}
function setProg(){document.querySelectorAll('#prog span').forEach((s,k)=>{s.className=k+1<S.chapter?'done':(k+1===S.chapter?'cur':'');});$('#invN').textContent=S.inv.length;}
document.querySelectorAll('.av').forEach(a=>a.style.backgroundImage=SHE_AV);
$('#chatHead .nm').textContent=CONFIG.HER_NAME;$('#toast .nm').textContent=CONFIG.HER_NAME;

/* ---------- chat ---------- */
function addMsg(from,text,store_=true){const d=document.createElement('div');d.className='m '+from;if(from==='her1'||from==='her2'){const t=document.createElement('span');t.className='tag';t.textContent=from==='her1'?'①':'②';d.appendChild(t);d.appendChild(document.createTextNode(text));}else d.textContent=text;$('#msgs').appendChild(d);$('#msgs').scrollTop=1e6;if(store_){S.chat.push([from,text]);if(S.chat.length>60)S.chat.shift();}}
function rebuildChat(){$('#msgs').innerHTML='';S.chat.forEach(m=>addMsg(m[0],m[1],false));}
function typing(ms){return new Promise(r=>{const t=document.createElement('div');t.className='typing';t.innerHTML='<i></i><i></i><i></i>';$('#msgs').appendChild(t);$('#msgs').scrollTop=1e6;$('#chatHead .st').textContent='печатает…';setTimeout(()=>{t.remove();$('#chatHead .st').textContent='в сети';r();},ms);});}

/* ---------- dialog typewriter ---------- */
let typingTimer=null,typingDone=true,fullText='';
function showText(who,text,narr){const d=$('#dlg');d.classList.add('on');$('#who').textContent=who||'';const t=$('#txt');t.className=narr?'narr':'';t.textContent='';$('#more').classList.remove('on');fullText=text;typingDone=false;let k=0;clearInterval(typingTimer);typingTimer=setInterval(()=>{k++;t.textContent=fullText.slice(0,k);if(k>=fullText.length)finishType();},28);}
function finishType(){clearInterval(typingTimer);$('#txt').textContent=fullText;typingDone=true;$('#more').classList.add('on');}

/* ---------- toast ---------- */
function toast(text){return new Promise(r=>{const t=$('#toast');t.querySelector('.tx').textContent=text;t.classList.add('on');setTimeout(()=>{waitTap(()=>{t.classList.remove('on');setTimeout(r,250);});},450);});}

/* ---------- tap handling ---------- */
let tapCb=null;
function waitTap(cb){tapCb=cb;}
$('#app').addEventListener('click',e=>{
  if(e.target.closest('button,.ov,input,#top,.sb,.tile'))return;
  if($('#chap').classList.contains('on')){if($('#chap').classList.contains('ready')&&tapCb){const c=tapCb;tapCb=null;c();}return;}
  if(!typingDone&&$('#dlg').classList.contains('on')){finishType();return;}
  if(tapCb){const c=tapCb;tapCb=null;c();}
});

/* ---------- engine ---------- */
function next(){S.i++;save();run();}
async function run(){
  const st=SCRIPT[S.i];if(!st)return;
  $('#choices').innerHTML='';
  if(st.chapter){S.chapter=st.chapter;setProg();save();const c=$('#chap');c.querySelector('.n').textContent='ГЛАВА '+ROMAN[st.chapter-1];c.querySelector('.t').textContent=st.title;c.className='on';$('#dlg').classList.remove('on');requestAnimationFrame(()=>c.classList.add('vis'));setTimeout(()=>c.classList.add('ready'),1300);waitTap(()=>{c.classList.remove('vis');setTimeout(()=>{c.className='';$('#fade').classList.remove('on');next();},700);});return;}
  if(st.head!==undefined&&!st.mode){S.head=st.head;$('#chatHead .nm').textContent=st.head;return next();}
  if(st.mode){if(st.tint!==undefined)S.tint=st.tint;if(st.head!==undefined){S.head=st.head;$('#chatHead .nm').textContent=st.head;}if(st.bg)setBg(st.bg);setMode(st.mode);if(st.mode==='chat')rebuildChat();return next();}
  if(st.quake){if(st.bg)setBg(st.bg);const ap=$('#app');ap.classList.remove('quake');void ap.offsetWidth;ap.classList.add('quake');setTimeout(()=>ap.classList.remove('quake'),2000);setTimeout(next,1200);return;}
  if(st.del){await typing(900);addMsg('del','Сообщение удалено');setTimeout(next,1400);return;}
  if(st.bg!==undefined&&Object.keys(st).length===1){setBg(st.bg);return next();}
  if(st.pose!==undefined&&!('say' in st)&&!('text' in st)){setPose(st.pose);return next();}
  if(st.ghost){setPose(st.ghost,true);return next();}
  if(st.fade){$('#dlg').classList.remove('on');setPose('');$('#fade').classList.add('on');setTimeout(next,1500);return;}
  if(st.chat!==undefined){if(S.mode!=='chat'){await toast(st.chat);return next();}await typing(Math.min(3200,900+st.chat.length*30));addMsg(st.from||'her',st.chat);setTimeout(next,900);return;}
  if(st.sys){addMsg('sys',st.sys);setTimeout(next,2200);return;}
  if(st.toast){await toast(st.toast);return next();}
  if(st.chatChoice||st.action){const f=$('#chatFoot');f.innerHTML='';const opts=st.chatChoice||[st.action];opts.forEach(o=>{const b=document.createElement('button');b.className='btn c';b.textContent=o;b.onclick=()=>{f.innerHTML='';if(st.chatChoice)addMsg('me',o);save();setTimeout(next,300);};f.appendChild(b);});$('#msgs').scrollTop=1e6;return;}
  if(st.narr){setPose(S.pose&&S.pose.startsWith('she_')?'':S.pose);showText('',st.narr,true);waitTap(next);return;}
  if('say' in st){if(st.pose!==undefined)setPose(st.pose);showText(st.say,st.text,!st.say);waitTap(next);return;}
  if(st.choice){$('#dlg').classList.remove('on');const ch=$('#choices');st.choice.forEach(o=>{const b=document.createElement('button');b.className='btn';b.textContent=o.label;b.onclick=async()=>{ch.innerHTML='';if(o.reply)await toast(o.reply);next();};ch.appendChild(b);});return;}
  if(st.doc){const ov=$('#itemPop');ov.querySelector('.card').innerHTML=`<h2>Её записи</h2>${docHTML(st.doc)}<div class="row"><button class="btn c">Дальше</button></div>`;ov.classList.add('on');ov.scrollTop=0;ov.querySelector('button').onclick=()=>{ov.classList.remove('on');next();};return;}
  if(st.task){if(S.mode==='chat'){const f=$('#chatFoot');f.innerHTML='';const b=document.createElement('button');b.className='btn c';b.textContent='Ввести ответ';b.onclick=()=>{f.innerHTML='';openTask(st.task);};f.appendChild(b);$('#msgs').scrollTop=1e6;return;}openTask(st.task);return;}
  if(st.item){giveItem(st.item);return;}
  if(st.removeItem){S.inv=S.inv.filter(x=>x!==st.removeItem);setProg();return next();}
  if(st.final){showFinal();return;}
  next();
}

/* ---------- items ---------- */
function itemImgHTML(id,cls){const it=ITEMS[id];if(it.img==='RELIEF')return `<div class="rel ${cls||''}" style="background-image:url('${symbolURI()}'),url('img/tex_stone.jpg')"></div>`;return `<img class="${cls||''}" src="${IMG(it.img)}" alt="">`;}
function markHTML(it){if(it.seq)return `<div class="seq">${it.seq.map(k=>SYM[k][1]).join('')}</div><div style="font-size:12px;color:var(--dim);margin-top:4px">${it.seq.map(k=>SYM[k][0]).join(' · ')}</div>`;if(it.sign===undefined)return '';return `<div class="sig">${SYM[it.sign][1]}<span>${SYM[it.sign][0]} · ${it.letter}</span></div>`;}
function giveItem(id){if(!S.inv.includes(id))S.inv.push(id);setProg();save();const it=ITEMS[id];const ov=$('#itemPop');ov.querySelector('.card').innerHTML=`<div style="color:var(--dim);font-size:13px;letter-spacing:.2em">ПОЛУЧЕН ПРЕДМЕТ</div>${itemImgHTML(id,'itemimg')}<h2>${it.name}</h2><p>${it.desc}</p>${markHTML(it)?`<div class="mark">${markHTML(it)}</div>`:''}<div class="row"><button class="btn c">Дальше</button></div>`;ov.classList.add('on');ov.querySelector('button').onclick=()=>{ov.classList.remove('on');next();};}
function renderInv(){const L=$('#invList');if(!S.inv.length){L.innerHTML='<div class="empty">Пока пусто.</div>';return;}L.innerHTML='<div class="grid">'+S.inv.map(id=>{const it=ITEMS[id];return `<div class="it">${itemImgHTML(id)}<div class="nm">${it.name}</div><div class="ds">${it.desc}</div>${markHTML(it)?`<div class="mk">${markHTML(it)}</div>`:''}</div>`;}).join('')+'</div>';}
$('#invBtn').onclick=()=>{renderInv();$('#invOv').classList.add('on');};
$('#invClose').onclick=()=>$('#invOv').classList.remove('on');

/* ---------- symbol svg ---------- */
function symbolSVG(){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300"><defs><filter id="g" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g fill="none" stroke="#86f5c8" stroke-width="9" stroke-linecap="round" filter="url(#g)"><circle cx="150" cy="128" r="92"/><path d="M85 128 Q150 70 215 128 Q150 186 85 128Z"/><circle cx="150" cy="128" r="17" fill="#86f5c8"/><path d="M118 214 C112 240 90 250 74 288"/><path d="M150 220 C162 245 138 262 150 294"/><path d="M182 214 C188 240 210 250 226 288"/><path d="M150 36 L150 20 M60 128 L44 128 M240 128 L256 128"/></g></svg>`;}
function symbolURI(){return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(symbolSVG());}

/* ---------- tasks ---------- */
function docHTML(d){if(d==='notes')return `<div class="paper notes">${DOCS.notes.map(n=>`<div class="nt"><span class="dt">${n[0]}</span>${n[1]}</div>`).join('')}</div>`;if(d==='log')return `<div class="paper logb"><div class="hd" style="font-family:Cormorant Garamond,serif">ШХУНА «ЭММА» · 1925</div>${DOCS.log.map(n=>`<div class="nt"><span class="dt">${n[0]}</span>${n[1]}</div>`).join('')}</div>`;if(d==='couplet')return `<div class="paper alien"><p>${DOCS.couplet[0]}</p><p class="dr">${DOCS.couplet[1]}</p></div>`;if(d==='clipping')return `<div class="paper news"><div class="hd">ГОРОДСКИЕ ВЕСТИ</div>${DOCS.clipping.map(l=>`<p>${l}</p>`).join('')}</div>`;if(d==='page')return `<div class="paper alien"><p>${DOCS.page[0]}</p><p class="dr">${DOCS.page[1]}</p></div>`;return '';}
function openTask(id){
  const T=TASKS[id];const ov=$('#taskOv');const card=$('#taskCard');
  const used=S.hints[id]||0;
  let body=`<h2>${T.title}</h2>`+(T.doc?docHTML(T.doc):'')+`<p>${T.prompt}</p>`;
  if(T.game==='simon')body+=simonHTML();
  else if(T.game==='relief')body+=`<div class="relief" id="relief"></div>`;
  else if(T.pick)body+=`<div class="row" style="flex-direction:column">${T.pick.map((o,k)=>`<button class="btn c pk" data-k="${k+1}">${o}</button>`).join('')}</div>`;
  else body+=`<input class="ans" id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ответ"><div class="row">${T.inv?'<button class="btn c ghostbtn" id="tInv">Инвентарь</button>':''}<button class="btn c" id="tOk">Проверить</button></div>`;
  body+=`<div class="msg" id="tMsg"></div><div class="hints" id="hints"></div><div class="row"><button class="btn c ghostbtn" id="tHint"></button></div>`;
  card.innerHTML=body;ov.classList.add('on');ov.scrollTop=0;
  const done=()=>{const m=$('#tMsg');m.className='msg ok';m.textContent='Верно.';setTimeout(()=>{ov.classList.remove('on');next();},900);};
  // hints
  const renderHints=()=>{const n=S.hints[id]||0;const H=$('#hints');H.innerHTML='';for(let k=0;k<n;k++){const h=document.createElement('div');h.className='hint';h.textContent=k<2?T.hints[k]:(T.a?'Ответ: '+dec(T.a):'Барельеф собран.');H.appendChild(h);}const b=$('#tHint');if(n>=3){b.style.display='none';}else{b.textContent=n<2?`Подсказка ${n+1} из 3`:(T.solveHint||'Показать ответ');}};
  renderHints();
  $('#tHint').onclick=()=>{S.hints[id]=(S.hints[id]||0)+1;save();renderHints();if(S.hints[id]===3&&T.game==='relief'&&window._reliefSolve)window._reliefSolve();};
  if(T.game==='simon')initSimon(done);
  else if(T.game==='relief')initRelief(done);
  else if(T.pick){card.querySelectorAll('.pk').forEach(b=>b.onclick=()=>{if(T.h.includes(fnv(b.dataset.k)))done();else{const m=$('#tMsg');m.className='msg';m.textContent=T.wrong||'Не то.';const ap=$('#app');ap.classList.remove('quake');void ap.offsetWidth;ap.classList.add('quake');}});}
  else{const inp=$('#ans');const bad=['Не то.','Нет. Подумай ещё.','Тишина. Ответ неверный.'];let bi=0;
    const check=()=>{const v=inp.value;if(!norm(v))return;if(T.h.includes(fnv(v))){inp.blur();done();}else{const m=$('#tMsg');m.className='msg';m.textContent=bad[bi++%bad.length];inp.classList.remove('shake');void inp.offsetWidth;inp.classList.add('shake');}};
    $('#tOk').onclick=check;inp.addEventListener('keydown',e=>{if(e.key==='Enter')check();});
    if(T.inv)$('#tInv').onclick=()=>{renderInv();$('#invOv').classList.add('on');};}
}

/* simon */
const SYM=[
 ['Око','<svg viewBox="0 0 100 100"><path d="M8 50 Q50 12 92 50 Q50 88 8 50Z"/><ellipse cx="50" cy="50" rx="7" ry="17"/></svg>'],
 ['Щупальце','<svg viewBox="0 0 100 100"><path d="M30 92 C20 60 70 58 62 34 C57 18 38 22 44 34 C48 42 58 38 56 30"/><circle cx="35" cy="72" r="3"/><circle cx="48" cy="58" r="3"/><circle cx="60" cy="46" r="3"/></svg>'],
 ['Знак','<svg viewBox="0 0 100 100"><path d="M50 6 L62 40 L96 40 L68 60 L79 94 L50 73 L21 94 L32 60 L4 40 L38 40Z"/><path d="M42 54 Q50 40 58 54 Q50 62 42 54Z"/></svg>'],
 ['Крылья','<svg viewBox="0 0 100 100"><path d="M50 62 L8 30 Q18 48 12 60 Q24 54 28 66 Q36 58 50 62Z"/><path d="M50 62 L92 30 Q82 48 88 60 Q76 54 72 66 Q64 58 50 62Z"/></svg>'],
 ['Башня','<svg viewBox="0 0 100 100"><path d="M30 92 L40 10 L66 16 L72 92Z"/><path d="M46 92 L48 70 L58 70 L60 92"/><path d="M14 92 L88 92"/></svg>'],
 ['Ктулху','<svg viewBox="0 0 100 100"><path d="M26 52 C22 18 78 18 74 52"/><circle cx="40" cy="42" r="4"/><circle cx="60" cy="42" r="4"/><path d="M30 52 C28 70 20 78 18 92"/><path d="M42 54 C42 72 36 82 38 94"/><path d="M58 54 C58 72 64 82 62 94"/><path d="M70 52 C72 70 80 78 82 92"/></svg>']];
const SEQS=[[0,2,4,1],[3,0,5,2,4,1],[5,1,3,0,2,4,5,3]];
function simonHTML(){return `<div class="simon">${SYM.map((s,k)=>`<div class="sb" data-k="${k}">${s[1]}<span>${s[0]}</span></div>`).join('')}</div><div class="sstat" id="sstat"></div><div class="row"><button class="btn c ghostbtn" id="sRep">Показать узор ещё раз</button></div>`;}
function initSimon(done){let round=0,pos=0,busy=true;const bs=[...document.querySelectorAll('.sb')];const st=$('#sstat');
  const lit=(k,ms)=>new Promise(r=>{bs[k].classList.add('lit');setTimeout(()=>{bs[k].classList.remove('lit');setTimeout(r,200);},ms);});
  const play=async()=>{busy=true;pos=0;st.textContent=`Круг ${round+1} из 3. Смотри…`;await new Promise(r=>setTimeout(r,700));for(const k of SEQS[round])await lit(k,600);st.textContent=`Круг ${round+1} из 3. Повтори`;busy=false;};
  bs.forEach(b=>b.onclick=async()=>{if(busy)return;const k=+b.dataset.k;busy=true;await lit(k,220);const Q=SEQS[round];if(k===Q[pos]){pos++;st.textContent=`Круг ${round+1} из 3: `+'●'.repeat(pos)+'○'.repeat(Q.length-pos);if(pos===Q.length){round++;if(round===SEQS.length){done();return;}st.textContent='Врата дрогнули…';setTimeout(play,1200);return;}busy=false;}else{st.textContent='Узор рассыпался.';$('.simon').classList.add('shake');setTimeout(()=>{$('.simon').classList.remove('shake');play();},1000);}});
  $('#sRep').onclick=()=>{if(!busy)play();};play();}

/* relief */
function initRelief(done){const R=$('#relief');let rot=[1,3,2,2,0,1,3,1,2];const uri=symbolURI();let solved=false;
  R.innerHTML=rot.map((r,k)=>`<div class="tile${k===4?' lock':''}" data-k="${k}" style="background-image:url('${uri}'),url('img/tex_stone.jpg');background-position:${(k%3)*50}% ${Math.floor(k/3)*50}%;transform:rotate(${r*90}deg)"></div>`).join('');
  const tiles=[...R.children];const apply=()=>tiles.forEach((t,k)=>t.style.transform=`rotate(${rot[k]*90}deg)`);
  const check=()=>{if(!solved&&rot.every(r=>r%4===0)){solved=true;R.classList.add('solved');done();}};
  tiles.forEach((t,k)=>t.onclick=()=>{if(k===4||solved)return;rot[k]++;apply();check();});
  window._reliefSolve=()=>{rot=rot.map(r=>Math.ceil(r/4)*4);apply();setTimeout(check,300);};}

/* ---------- final ---------- */
function showFinal(){$('#dlg').classList.remove('on');const ov=$('#final');const ph=CONFIG.PHONE;
  ov.querySelector('.card').innerHTML=`<div style="color:var(--dim);letter-spacing:.3em;font-size:13px">КОНЕЦ</div><div class="t">С днём рождения</div><p>Он будет спать дальше.<br>А ты проснулся.</p><p style="color:var(--dim);font-size:14px">Пройдено глав: 6 из 6</p>${ph?`<p style="font:700 22px 'Cormorant Garamond',serif;color:var(--glow);margin:4px 0">Позвони ей.</p><p style="font-size:20px;letter-spacing:.06em">${ph}</p><div class="row"><a class="btn c" style="text-decoration:none" href="tel:${ph.replace(/[^+\d]/g,'')}" target="_top">Позвонить</a><button class="btn c ghostbtn" id="cpy">Скопировать номер</button></div>`:`<p style="font:700 22px 'Cormorant Garamond',serif;color:var(--glow)">Позвони ей.</p>`}`;
  ov.classList.add('on');const c=$('#cpy');if(c)c.onclick=async()=>{try{await navigator.clipboard.writeText(ph);c.textContent='Скопировано';}catch(e){c.textContent='Не вышло — набери вручную';}};}

/* ---------- admin (5 быстрых нажатий на полоску глав или адрес с #admin) ---------- */
let taps=[];$('#prog').addEventListener('click',()=>{const n=Date.now();taps=taps.filter(t=>n-t<2500);taps.push(n);if(taps.length>=5){taps=[];openAdmin();}});
function openAdmin(){const ov=$('#admin');const rows=Object.entries(TASKS).map(([k,t])=>`<tr><td>${t.title}</td><td style="color:var(--glow)">${t.a?dec(t.a):'мини-игра'}</td></tr>`).join('');
  ov.querySelector('.card').innerHTML=`<h2>Меню хозяйки</h2><p style="color:var(--dim);font-size:14px">Это меню видно только тому, кто знает, как его открыть.</p><button class="btn" id="aReset">Начать заново (стереть прогресс)</button>${[1,2,3,4,5,6].map(n=>`<button class="btn ghostbtn" data-ch="${n}">Перейти к главе ${ROMAN[n-1]}</button>`).join('')}<h2 style="font-size:20px;margin-top:16px">Шпаргалка</h2><table>${rows}</table><div class="row"><button class="btn c" id="aClose">Закрыть</button></div>`;
  ov.classList.add('on');
  $('#aReset').onclick=()=>{store.clear();location.hash='';setTimeout(()=>location.reload(),600);};
  $('#aClose').onclick=()=>ov.classList.remove('on');
  ov.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>jump(+b.dataset.ch));}
function jump(ch){const idx=SCRIPT.findIndex(s=>s.chapter===ch);let inv=[],bg='',mode='vn';for(let k=0;k<idx;k++){const s=SCRIPT[k];if(s.item&&!inv.includes(s.item))inv.push(s.item);if(s.removeItem)inv=inv.filter(x=>x!==s.removeItem);}
  S={i:idx,inv,chat:[],mode:'vn',bg:'',pose:'',chapter:ch,started:true,hints:{},tint:false,head:CONFIG.HER_NAME};save();location.hash='';setTimeout(()=>location.reload(),600);}

/* ---------- boot ---------- */
function boot(){cloudLoad(cv=>boot2(store.get()||cv));}
function boot2(sv){
  if(sv&&sv.started){S=Object.assign(S,sv);if(S.head)$('#chatHead .nm').textContent=S.head;$('#start').classList.remove('on');setBg(S.bg);setProg();setMode(S.mode);if(S.mode==='chat')rebuildChat();
    // если остановились на середине выбора/реплики — начнём с этого шага
    run();}
  else{$('#start').classList.add('on');$('#startBtn').onclick=()=>{S.started=true;save();$('#start').classList.remove('on');run();};}
  if(location.hash==='#admin')openAdmin();}
window.addEventListener('hashchange',()=>{if(location.hash==='#admin')openAdmin();});
boot();
})();
</script>
